<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ข้อมูลทรัพย์สินสถานีไฟฟ้า</title>
<!-- enertric-ui: layout rules adapted from unslop by Damir Sokolovsky (@heydamir), CC BY 4.0 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafafa; --card:#fff; --raised:#f4f4f5; --hair:rgba(23,23,23,.08); --line:#d4d4d8;
    --t1:#171717; --t2:#454545; --t3:#666; --accent:#2a64c8; --pos:#16a34a; --neg:#dc2626; --warn:#d97706;
    --font:'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--t1);font:400 14px/1.55 var(--font);font-variant-numeric:tabular-nums}
  button,input,select,textarea{font:inherit;color:inherit}
  button{background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:7px 14px;cursor:pointer;transition:background-color .15s ease}
  button:hover{background:var(--raised)} button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--t1);color:#fff;border-color:var(--t1)} button.primary:hover{background:#333}
  button.danger{color:var(--neg)} button.link{border:none;background:none;padding:4px 6px;color:var(--t2)} button.link:hover{color:var(--t1)}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(42,100,200,.12)}
  label{display:block;color:var(--t2);font-size:13px;margin-bottom:4px}
  .muted{color:var(--t3)} .mono{font-family:var(--mono)} .req{color:var(--neg)}
  .card{background:var(--card);border:1px solid var(--hair);border-radius:14px;box-shadow:0 1px 2px rgba(23,23,23,.04),0 4px 16px rgba(23,23,23,.04)}
  /* login */
  #login{min-height:100vh;display:grid;place-items:center;padding:24px}
  #login .card{max-width:420px;width:100%;padding:32px}
  #login h1{margin:0 0 6px;font-size:24px;font-weight:500}
  /* shell */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--hair);background:var(--card);position:sticky;top:0;z-index:5}
  .crumb{display:flex;align-items:center;gap:8px;font-weight:500}
  .crumb svg{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:1.5}
  .top .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--raised);color:var(--t2)}
  .badge.demo{background:#fff4e5;color:#8a4b0f}
  .layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 62px)}
  aside{border-right:1px solid var(--hair);background:var(--card);padding:16px;display:flex;flex-direction:column;gap:10px}
  aside .list{overflow:auto;flex:1;margin:0 -6px}
  .st{display:block;width:100%;text-align:left;border:none;border-radius:8px;padding:9px 10px;background:none}
  .st:hover{background:var(--raised)} .st.on{background:#eef3fc}
  .st b{display:block;font-weight:500} .st span{font-size:12px;color:var(--t3)}
  main{padding:24px 32px 48px;min-width:0}
  h1{margin:0 0 4px;font-size:30px;font-weight:400;line-height:1.2} h1 span{color:#a3a3a3}
  h2{margin:0;font-size:16px;font-weight:500}
  .lede{margin:0 0 20px;color:var(--t3);font-size:13px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .info{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 24px;padding:18px 22px;margin-bottom:16px}
  .info dt{color:var(--t3);font-size:12px} .info dd{margin:2px 0 0}
  .grp{margin-bottom:14px;padding:16px 20px}
  h2.cat{font-size:20px;font-weight:500;margin:28px 0 12px}
  .tree .cath{padding:10px 8px 4px;font-size:12px;color:var(--t3)}
  .grp-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .grp-head button{white-space:nowrap;flex:none}
  .grp-head .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
  .eqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
  .eq{display:block;text-align:left;border:1px solid var(--hair);border-radius:10px;padding:10px 12px;background:#fff}
  .eq:hover{border-color:var(--accent)} .eq b{display:block;font-weight:500}
  .bar{height:6px;border-radius:3px;background:var(--raised);margin-top:8px;overflow:hidden} .bar i{display:block;height:100%;background:var(--pos)}
  .bar.low i{background:var(--warn)}
  .form{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px 20px;padding:20px 22px}
  .form .f small{display:block;color:var(--t3);font-size:12px;margin-top:2px}
  .tag-proposed{font-size:11px;color:#8a4b0f;background:#fff4e5;border-radius:4px;padding:0 5px;margin-left:4px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:400;color:var(--t2);padding:8px 10px;border-bottom:1px solid var(--hair)}
  td{padding:8px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
  .tree{max-height:70vh;overflow:auto}
  .tree button{display:block;width:100%;text-align:left;border:none;background:none;border-radius:6px;padding:5px 8px}
  .tree button.on{background:#eef3fc} .tree .child{padding-left:22px;color:var(--t2)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
  .modal h3{margin:0 0 14px;font-size:18px;font-weight:500}
  .modal .fields{display:grid;gap:12px} .modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--t1);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
  #toast.show{opacity:1}
  .empty{padding:40px;text-align:center;color:var(--t3)}
  @media (max-width:900px){.layout{grid-template-columns:1fr} aside{border-right:none;border-bottom:1px solid var(--hair);max-height:40vh} main{padding:18px 16px}}
</style>
</head>
<body>
<div id="login" style="display:none">
  <div class="card">
    <h1 id="loginTitle">ข้อมูลทรัพย์สินสถานีไฟฟ้า</h1>
    <p class="muted" style="margin:0 0 20px">เก็บข้อมูลอุปกรณ์ในสถานีไฟฟ้าตามมาตรฐานโครงสร้างข้อมูล เข้าใช้ได้เฉพาะผู้ที่ได้รับอนุญาต</p>
    <form id="pwForm" style="display:none;margin-bottom:12px" autocomplete="on">
      <label for="lgEmail">อีเมล</label><input id="lgEmail" type="email" autocomplete="username" style="margin-bottom:10px">
      <label for="lgPass">รหัสผ่าน</label><input id="lgPass" type="password" autocomplete="current-password">
    </form>
    <button class="primary" id="loginBtn" style="width:100%;padding:11px">เข้าสู่ระบบด้วย Google</button>
    <p id="loginMsg" class="muted" style="margin:14px 0 0;font-size:13px"></p>
  </div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <div class="crumb"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span id="appName">ข้อมูลทรัพย์สินสถานีไฟฟ้า</span> <span id="modeBadge"></span></div>
    <div class="right">
      <button class="link" id="navSchema" hidden>โครงสร้างฟิลด์</button>
      <button class="link" id="navUsers" hidden>ผู้ใช้</button>
      <button class="link" id="whoami" title="บัญชีของฉัน"></button>
      <button id="logoutBtn">ออกจากระบบ</button>
    </div>
  </div>
  <div class="layout">
    <aside>
      <div class="row" style="justify-content:space-between"><h2><button class="link" id="overviewBtn" style="font-size:16px;color:var(--t1);padding:0">สถานีไฟฟ้า</button></h2><button id="addStationBtn" hidden>+ เพิ่มสถานี</button></div>
      <input type="search" id="stSearch" placeholder="ค้นหาชื่อหรือรหัสสถานี" aria-label="ค้นหาสถานี">
      <div class="list" id="stList"></div>
    </aside>
    <main id="main"><div class="empty">กำลังโหลด…</div></main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script>if (!window.XLSX) { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; document.head.appendChild(s); }</script>
<script type="module">
const CFG = window.APP_CONFIG || {}, FB = CFG.firebase || {};
const SERVER = CFG.mode === 'server';
const DEMO = !SERVER && !FB.apiKey;
const OWNERS = (CFG.ownerEmails || []).map(e => e.toLowerCase());
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); };
const ROLE_TH = { admin: 'ผู้ดูแล', editor: 'ผู้แก้ไข', viewer: 'ผู้ดูอย่างเดียว' };
const STATUS_TH = { current: 'ใช้อยู่', add: 'เสนอเพิ่ม', review: 'รอพิจารณา', remove: 'เสนอตัด' };
const TYPE_TH = { text: 'ข้อความ', number: 'ตัวเลข', date: 'วันที่', select: 'ตัวเลือก' };
if (CFG.appName) { $('appName').textContent = CFG.appName; $('loginTitle').textContent = CFG.appName; document.title = CFG.appName; }

// ================= storage: Firestore, or this browser in demo mode =================
let store, me = { email: '', name: '', role: 'viewer' };
function demoStore() {
  const K = 'subdata-demo', load = () => JSON.parse(localStorage.getItem(K) || '{"config":{},"users":{},"stations":{},"eq":{},"log":[]}');
  const save = d => localStorage.setItem(K, JSON.stringify(d));
  return {
    async getSchema() { return load().config.schema || null; },
    async saveSchema(s) { const d = load(); d.config.schema = s; save(d); },
    async listStations() { return Object.values(load().stations); },
    async saveStation(st) { const d = load(); d.stations[st.id] = st; save(d); },
    async deleteStation(id) { const d = load(); delete d.stations[id]; delete d.eq[id]; save(d); },
    async listEquipment(sid) { return Object.values((load().eq[sid]) || {}); },
    async listAllEquipment() { const d = load(); return Object.entries(d.eq).flatMap(([sid, m]) => Object.values(m).map(e => ({ ...e, stationId: sid }))); },
    async saveEquipment(sid, e) { const d = load(); (d.eq[sid] = d.eq[sid] || {})[e.id] = e; save(d); },
    async deleteEquipment(sid, id) { const d = load(); if (d.eq[sid]) delete d.eq[sid][id]; save(d); },
    async listUsers() { return Object.entries(load().users).map(([email, u]) => ({ email, ...u })); },
    async saveUser(email, u) { const d = load(); d.users[email] = u; save(d); },
    async deleteUser(email) { const d = load(); delete d.users[email]; save(d); },
    async getUser(email) { return load().users[email] || null; },
    async addLog(x) { const d = load(); d.log.unshift(x); d.log = d.log.slice(0, 500); save(d); }
  };
}
async function firestoreStore() {
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = initializeApp(FB), auth = A.getAuth(app), db = F.getFirestore(app);
  const all = async q => (await F.getDocs(q)).docs.map(d => ({ id: d.id, ...d.data() }));
  return {
    auth, A,
    async getSchema() { const s = await F.getDoc(F.doc(db, 'config', 'schema')); return s.exists() ? s.data() : null; },
    async saveSchema(s) { await F.setDoc(F.doc(db, 'config', 'schema'), s); },
    async listStations() { return all(F.collection(db, 'stations')); },
    async saveStation(st) { const { id, ...rest } = st; await F.setDoc(F.doc(db, 'stations', id), rest); },
    async deleteStation(id) {
      const eqs = await all(F.collection(db, 'stations', id, 'equipment'));
      await Promise.all(eqs.map(e => F.deleteDoc(F.doc(db, 'stations', id, 'equipment', e.id))));
      await F.deleteDoc(F.doc(db, 'stations', id));
    },
    async listEquipment(sid) { return all(F.collection(db, 'stations', sid, 'equipment')); },
    async listAllEquipment() { return (await F.getDocs(F.collectionGroup(db, 'equipment'))).docs.map(d => ({ id: d.id, stationId: d.ref.parent.parent.id, ...d.data() })); },
    async saveEquipment(sid, e) { const { id, ...rest } = e; await F.setDoc(F.doc(db, 'stations', sid, 'equipment', id), rest); },
    async deleteEquipment(sid, id) { await F.deleteDoc(F.doc(db, 'stations', sid, 'equipment', id)); },
    async listUsers() { return (await all(F.collection(db, 'users'))).map(u => ({ email: u.id, ...u })); },
    async saveUser(email, u) { await F.setDoc(F.doc(db, 'users', email), u); },
    async deleteUser(email) { await F.deleteDoc(F.doc(db, 'users', email)); },
    async getUser(email) { const s = await F.getDoc(F.doc(db, 'users', email)); return s.exists() ? s.data() : null; },
    async addLog(x) { try { await F.addDoc(F.collection(db, 'log'), x); } catch (e) { console.warn('log', e); } }
  };
}

function serverStore() {
  const call = async (method, url, body) => {
    const r = await fetch('api/' + url, { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'subdata' }, body: body === undefined ? undefined : JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
    return j;
  };
  const enc = encodeURIComponent;
  return {
    call,
    async getSchema() { return (await call('GET', 'schema')).schema; },
    async saveSchema(s) { await call('PUT', 'schema', s); },
    async listStations() { return call('GET', 'stations'); },
    async saveStation(st) { await call('PUT', 'stations/' + enc(st.id), st); },
    async deleteStation(id) { await call('DELETE', 'stations/' + enc(id)); },
    async listEquipment(sid) { return call('GET', 'stations/' + enc(sid) + '/equipment'); },
    async listAllEquipment() { return call('GET', 'equipment'); },
    async saveEquipment(sid, e) { await call('PUT', 'stations/' + enc(sid) + '/equipment/' + enc(e.id), e); },
    async deleteEquipment(sid, id) { await call('DELETE', 'stations/' + enc(sid) + '/equipment/' + enc(id)); },
    async listUsers() { return call('GET', 'users'); },
    async saveUser(email, u) { await call('PUT', 'users/' + enc(email), u); },
    async deleteUser(email) { await call('DELETE', 'users/' + enc(email)); },
    async getUser() { return null; },
    async addLog(x) { try { await call('POST', 'log', x); } catch (e) { console.warn('log', e); } }
  };
}
const can = { edit: () => me.role === 'admin' || me.role === 'editor', admin: () => me.role === 'admin' };
const log = (action, target) => store.addLog({ t: new Date().toISOString(), user: me.email, action, target });

// ================= state =================
let schema = null, nodes = {}, stations = [], cur = { station: null, eq: [], view: 'station', eqId: null, typeId: null };
function indexSchema() {
  nodes = {};
  schema.tree.forEach(g => { nodes[g.id] = { ...g, group: g, parent: null }; (g.children || []).forEach(c => { nodes[c.id] = { ...c, group: g, parent: g }; }); });
}
const catOf = g => (g && g.category) || 'อุปกรณ์ไฟฟ้ากำลัง';
const typeName = n => n ? (n.nameTh ? n.nameTh + ' (' + n.name + ')' : n.name) : '-';
const liveFields = n => (n && n.fields || []).filter(f => f.status !== 'remove');
function completeness(e) {
  const req = liveFields(nodes[e.typeId]).filter(f => f.required);
  if (!req.length) return null;
  const done = req.filter(f => String((e.values || {})[f.id] ?? '').trim() !== '').length;
  return Math.round(100 * done / req.length);
}
const eqLabel = e => e.tag || (e.values && (Object.values(e.values).find(v => v) || '')) || '(ยังไม่ตั้งชื่อ)';

// ================= modal form =================
function ask(title, fields, okText) {
  return new Promise(res => {
    const m = $('modal');
    m.innerHTML = `<h3>${esc(title)}</h3><div class="fields">${fields.map((f, i) => `<div><label for="mf${i}">${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</label>${
      f.type === 'select' ? `<select id="mf${i}">${f.options.map(o => `<option value="${esc(o[0])}"${o[0] === f.value ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`
      : f.type === 'textarea' ? `<textarea id="mf${i}" rows="3">${esc(f.value || '')}</textarea>`
      : f.type === 'checkbox' ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mf${i}" style="width:auto"${f.value ? ' checked' : ''}>${esc(f.hint || '')}</label>`
      : f.type === 'file' ? `<input id="mfFile" type="file" accept=".xlsx,.xls,.csv"><input id="mf${i}" type="hidden" value="x">`
      : `<input id="mf${i}" type="${f.type || 'text'}" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}">`}</div>`).join('')}</div>
      <div class="acts"><button id="mCancel">ยกเลิก</button><button class="primary" id="mOk">${esc(okText || 'บันทึก')}</button></div>`;
    $('modalBg').style.display = 'flex';
    const close = v => { $('modalBg').style.display = 'none'; res(v); };
    $('mCancel').onclick = () => close(null);
    $('mOk').onclick = () => {
      const vals = fields.map((f, i) => f.type === 'checkbox' ? $('mf' + i).checked : $('mf' + i).value.trim());
      const miss = fields.findIndex((f, i) => f.required && !vals[i]);
      if (miss >= 0) { $('mf' + miss).focus(); toast('กรอก ' + fields[miss].label); return; }
      close(vals);
    };
    setTimeout(() => { const f = $('mf0'); if (f) f.focus(); }, 50);
  });
}
const confirmBox = async (msg, ok) => !!(await ask(msg, [], ok || 'ยืนยัน'));

// ================= stations =================
async function loadStations() { stations = (await store.listStations()).sort((a, b) => String(a.name).localeCompare(String(b.name), 'th')); renderStations(); }
function renderStations() {
  const q = $('stSearch').value.trim().toLowerCase();
  const list = stations.filter(s => !q || (s.name + ' ' + (s.code || '') + ' ' + (s.district || '')).toLowerCase().includes(q));
  $('stList').innerHTML = list.length ? list.map(s => `<button class="st${cur.station && cur.station.id === s.id ? ' on' : ''}" data-st="${esc(s.id)}"><b>${esc(s.name)}</b><span>${esc([s.code, s.district].filter(Boolean).join(' · '))}</span></button>`).join('')
    : `<div class="empty" style="padding:20px">${stations.length ? 'ไม่พบสถานี' : 'ยังไม่มีสถานี'}</div>`;
}
$('stSearch').addEventListener('input', renderStations);
$('stList').addEventListener('click', e => { const b = e.target.closest('[data-st]'); if (b) openStation(b.dataset.st); });
async function editStation(st) {
  const v = await ask(st ? 'แก้ไขข้อมูลสถานี' : 'เพิ่มสถานีไฟฟ้า', [
    { label: 'ชื่อสถานี', value: st && st.name, required: true, placeholder: 'เช่น สถานีย่อยบางมด' },
    { label: 'รหัสสถานี', value: st && st.code, placeholder: 'เช่น BM' },
    { label: 'หน่วยงาน / เขต', value: st && st.district, placeholder: 'เช่น ฝบร. หรือ ฟขธ.' },
    { label: 'ระดับแรงดัน', value: st && st.voltage, placeholder: 'เช่น 69/24 kV' },
    { label: 'ที่ตั้ง', value: st && st.address },
    { label: 'ละติจูด', value: st && st.lat, type: 'number' }, { label: 'ลองจิจูด', value: st && st.lon, type: 'number' },
    { label: 'หมายเหตุ', value: st && st.note, type: 'textarea' }]);
  if (!v) return;

  $('main').querySelectorAll('[data-du]').forEach(b => b.onclick = async () => { if (await confirmBox('ลบสิทธิ์ ' + b.dataset.du + '?', 'ลบ')) { await store.deleteUser(b.dataset.du); log('ลบผู้ใช้', b.dataset.du); renderUsers(); } });
}

// ================= Excel export: one sheet per equipment type =================
function exportStation() {
  if (typeof XLSX === 'undefined') { toast('ไม่พบไลบรารี Excel'); return; }
  const st = cur.station, wb = XLSX.utils.book_new(), used = new Set();
  const info = [['ชื่อสถานี', st.name], ['รหัส', st.code || ''], ['หน่วยงาน / เขต', st.district || ''], ['ระดับแรงดัน', st.voltage || ''], ['ที่ตั้ง', st.address || ''], ['ละติจูด', st.lat || ''], ['ลองจิจูด', st.lon || ''], ['ส่งออกเมื่อ', new Date().toLocaleString('th-TH')]];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), 'สถานี');
  Object.values(nodes).forEach(n => {
    const list = cur.eq.filter(e => e.typeId === n.id); if (!list.length) return;
    const fs = liveFields(n), aoa = [['ชื่อเรียก', 'อยู่ภายใต้'].concat(fs.map(f => f.name + (f.unit ? ' (' + f.unit + ')' : '')))];
    list.forEach(e => { const p = e.parentId && cur.eq.find(x => x.id === e.parentId); aoa.push([eqLabel(e), p ? eqLabel(p) : ''].concat(fs.map(f => (e.values || {})[f.id] ?? ''))); });
    let name = (n.sheet || n.name).replace(/[\\/?*[\]:]/g, ' ').slice(0, 31); while (used.has(name)) name = name.slice(0, 28) + '_' + used.size; used.add(name);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name);
  });
  XLSX.writeFile(wb, 'ข้อมูลสถานี-' + (st.code || st.name) + '-' + new Date().toISOString().slice(0, 10) + '.xlsx');
}


// ================= overview of all stations =================
async function renderOverview() {
  if (!stations.length) { $('main').innerHTML = `<div class="empty">${can.edit() ? 'เริ่มต้นโดยกด "+ เพิ่มสถานี"' : 'ยังไม่มีสถานีในระบบ'}</div>`; return; }
  $('main').innerHTML = '<div class="empty">กำลังสรุปข้อมูลทุกสถานี…</div>';
  let all = [];
  try { all = await store.listAllEquipment(); } catch (e) { $('main').innerHTML = '<div class="empty">สรุปไม่ได้: ' + esc(e.message) + '</div>'; return; }
  if (cur.station || cur.view !== 'station') return;   // user moved on while loading
  const cats = [...new Set(schema.tree.map(catOf))];
  const by = {}; stations.forEach(s => by[s.id] = { n: 0, cat: {}, pct: [] });
  all.forEach(e => { const b = by[e.stationId]; if (!b || !nodes[e.typeId]) return; b.n++; const c = catOf(nodes[e.typeId].group); b.cat[c] = (b.cat[c] || 0) + 1; const p = completeness(e); if (p !== null) b.pct.push(p); });
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
  const allPct = avg(Object.values(by).flatMap(b => b.pct));
  const total = all.filter(e => nodes[e.typeId]).length;
  const byType = {}; all.forEach(e => { if (nodes[e.typeId]) byType[e.typeId] = (byType[e.typeId] || 0) + 1; });
  const topTypes = Object.entries(byType).sort((a, b) => b[1] - a[1]).slice(0, 8);
  $('main').innerHTML = `
    <h1>ภาพรวม <span>${stations.length} สถานี</span></h1>
    <p class="lede">อุปกรณ์ทั้งหมดที่บันทึกในระบบ เลือกสถานีจากรายการด้านซ้ายเพื่อดูหรือแก้ไข</p>
    <div class="info card" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">
      <div><dt>สถานี</dt><dd style="font-size:28px">${stations.length.toLocaleString()}</dd></div>
      <div><dt>อุปกรณ์ทั้งหมด</dt><dd style="font-size:28px">${total.toLocaleString()}</dd></div>
      ${cats.map(c => `<div><dt>${esc(c)}</dt><dd style="font-size:28px">${Object.values(by).reduce((a, b) => a + (b.cat[c] || 0), 0).toLocaleString()}</dd></div>`).join('')}
      <div><dt>กรอกฟิลด์จำเป็นเฉลี่ย</dt><dd style="font-size:28px">${allPct === null ? '-' : allPct + '%'}</dd></div>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:16px">
      <div class="card" style="padding:6px 14px;overflow:auto"><table><thead><tr><th>สถานี</th><th>หน่วยงาน</th>${cats.map(c => `<th style="text-align:right">${esc(c)}</th>`).join('')}<th style="text-align:right">รวม</th><th>ฟิลด์จำเป็น</th></tr></thead><tbody>
        ${stations.map(s => { const b = by[s.id], p = avg(b.pct); return `<tr style="cursor:pointer" data-go="${esc(s.id)}"><td><b style="font-weight:500">${esc(s.name)}</b> <span class="muted">${esc(s.code || '')}</span></td><td>${esc(s.district || '')}</td>${cats.map(c => `<td style="text-align:right" class="mono">${b.cat[c] || 0}</td>`).join('')}<td style="text-align:right" class="mono">${b.n}</td><td style="min-width:140px">${p === null ? '<span class="muted">-</span>' : `<div class="bar${p < 80 ? ' low' : ''}" style="margin:6px 0 2px"><i style="width:${p}%"></i></div><span class="muted" style="font-size:12px">${p}%</span>`}</td></tr>`; }).join('')}
      </tbody></table></div>
      <div class="card" style="padding:16px 18px"><h2 style="margin-bottom:10px">ชนิดอุปกรณ์ที่บันทึกมากสุด</h2>
        ${topTypes.length ? topTypes.map(([id, n]) => `<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--hair)"><span>${esc(nodes[id].nameTh || nodes[id].name)}</span><span class="mono">${n}</span></div>`).join('') : '<div class="muted">ยังไม่มีอุปกรณ์</div>'}</div>
    </div>`;
  $('main').querySelectorAll('[data-go]').forEach(r => r.onclick = () => openStation(r.dataset.go));
}

// ================= Excel import / blank template =================
const norm = x => String(x ?? '').toLowerCase().replace(/[\s._\-()/]+/g, '');
function typeOptions() { const o = []; schema.tree.forEach(g => { o.push([g.id, (g.nameTh || g.name) + ' — ' + g.name]); (g.children || []).forEach(c => o.push([c.id, '   › ' + (c.nameTh || c.name) + ' — ' + c.name])); }); return o; }
async function downloadTemplate() {
  if (typeof XLSX === 'undefined') { toast('ไม่พบไลบรารี Excel'); return; }
  const v = await ask('ดาวน์โหลดแบบฟอร์มว่าง', [{ label: 'ชนิดอุปกรณ์', type: 'select', value: schema.tree[0].id, options: typeOptions() }], 'ดาวน์โหลด');
  if (!v) return;
  const n = nodes[v[0]], fs = liveFields(n), wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([['ชื่อเรียก'].concat(fs.map(f => f.name))]);
  ws['!cols'] = [{ wch: 16 }].concat(fs.map(f => ({ wch: Math.max(12, f.name.length + 2) })));
  XLSX.utils.book_append_sheet(wb, ws, (n.sheet || n.name).replace(/[\\/?*[\]:]/g, ' ').slice(0, 31));
  XLSX.writeFile(wb, 'แบบฟอร์ม-' + n.name.slice(0, 40) + '.xlsx');
}
async function importExcel() {
  if (typeof XLSX === 'undefined') { toast('ไม่พบไลบรารี Excel'); return; }
  const v = await ask('นำเข้าอุปกรณ์จาก Excel', [
    { label: 'ชนิดอุปกรณ์ในไฟล์', type: 'select', value: schema.tree[0].id, options: typeOptions() },
    { label: 'ไฟล์ Excel (แถวแรกเป็นชื่อฟิลด์ 1 แถวต่อ 1 อุปกรณ์)', type: 'file' }], 'อ่านไฟล์');
  if (!v) return;
  const n = nodes[v[0]], file = $('mfFile') && $('mfFile').files[0];
  if (!file) { toast('ยังไม่ได้เลือกไฟล์'); return; }
  const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' }).filter(r => r.some(c => String(c).trim() !== ''));
  if (rows.length < 2) { toast('ไม่พบข้อมูลในไฟล์'); return; }
  const head = rows[0].map(h => String(h).trim()), fs = liveFields(n), map = {}, unknown = [];
  head.forEach((h, i) => { const f = fs.find(f => norm(f.name) === norm(h) || (f.label && norm(f.label) === norm(h))); if (f) map[i] = f; else if (norm(h) !== norm('ชื่อเรียก') && h) unknown.push(h); });
  const tagCol = head.findIndex(h => norm(h) === norm('ชื่อเรียก'));
  const pick = names => { for (const nm of names) { const i = head.findIndex(h => norm(h) === norm(nm)); if (i >= 0) return i; } return -1; };
  const nameCol = tagCol >= 0 ? tagCol : pick(['Name', 'Mea No.', 'Bay', 'Function Name', 'Feeder No.', 'Position']);
  // components need a parent of the right group in this station
  let parentId = null;
  if (n.parent) {
    const parents = cur.eq.filter(e => !e.parentId && e.typeId === n.parent.id);
    if (!parents.length) { toast('เพิ่ม "' + (n.parent.nameTh || n.parent.name) + '" ในสถานีนี้ก่อน แล้วค่อยนำเข้าส่วนประกอบ'); return; }
    const p = await ask('นำเข้าเป็นส่วนประกอบของ', [{ label: n.parent.nameTh || n.parent.name, type: 'select', value: parents[0].id, options: parents.map(e => [e.id, eqLabel(e)]) }], 'ต่อไป');
    if (!p) return; parentId = p[0];
  }
  const cell = (x, f) => { if (x === '' || x === null || x === undefined) return undefined;
    if (x instanceof Date) return f.type === 'date' ? x.toISOString().slice(0, 10) : x.toISOString().slice(0, 10);
    if (f.type === 'number') { const num = Number(String(x).replace(/,/g, '')); return isNaN(num) ? String(x) : num; }
    return String(x).trim(); };
  const items = rows.slice(1).map((r, k) => { const values = {}; Object.entries(map).forEach(([i, f]) => { const val = cell(r[i], f); if (val !== undefined) values[f.id] = val; });
    return { tag: String(nameCol >= 0 ? r[nameCol] : '').trim() || (n.name + ' ' + (k + 1)), values }; }).filter(x => Object.keys(x.values).length);
  const ok = await confirmBox(`พบ ${items.length} รายการ · จับคู่ได้ ${Object.keys(map).length} จาก ${head.length} คอลัมน์${unknown.length ? ' · ไม่รู้จัก: ' + unknown.slice(0, 6).join(', ') + (unknown.length > 6 ? ' …' : '') : ''} · นำเข้าเป็น "${n.nameTh || n.name}" ในสถานี ${cur.station.name}?`, 'นำเข้า');
  if (!ok) return;
  const now = new Date().toISOString();
  for (const it of items) { const e = { id: uid('eq'), typeId: n.id, parentId, tag: it.tag, values: it.values, createdAt: now, createdBy: me.email, updatedAt: now, updatedBy: me.email }; await store.saveEquipment(cur.station.id, e); cur.eq.push(e); }
  log('นำเข้า Excel', cur.station.name + ' › ' + n.name + ' ' + items.length + ' รายการ'); toast('นำเข้า ' + items.length + ' รายการแล้ว'); render();
}


// ================= backup / restore (moves data between the cloud and the on-premises server) =================
async function backupAll() {
  toast('กำลังรวบรวมข้อมูล…');
  const out = { app: 'subdata', made: new Date().toISOString(), by: me.email, schema, stations: await store.listStations(), equipment: await store.listAllEquipment() };
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'subdata-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  log('สำรองข้อมูล', out.stations.length + ' สถานี ' + out.equipment.length + ' อุปกรณ์');
}
async function restoreAll() {
  const v = await ask('นำเข้าไฟล์สำรอง', [{ label: 'ไฟล์ .json ที่ได้จากปุ่ม "สำรองข้อมูลทั้งหมด"', type: 'file' },
    { label: 'แทนที่โครงสร้างฟิลด์ด้วยของในไฟล์', type: 'checkbox', value: true, hint: 'ใช่' }], 'อ่านไฟล์');
  if (!v) return;
  const f = $('mfFile') && $('mfFile').files[0]; if (!f) { toast('ยังไม่ได้เลือกไฟล์'); return; }
  let b; try { b = JSON.parse(await f.text()); } catch (e) { toast('อ่านไฟล์ไม่ได้'); return; }
  if (b.app !== 'subdata') { toast('ไม่ใช่ไฟล์สำรองของระบบนี้'); return; }
  if (!(await confirmBox(`นำเข้า ${b.stations.length} สถานี ${b.equipment.length} อุปกรณ์ (สำรองเมื่อ ${new Date(b.made).toLocaleString('th-TH')}) รายการที่รหัสซ้ำจะถูกแทนที่`, 'นำเข้า'))) return;
  if (SERVER) { const r = await store.call('POST', 'backup', Object.assign(b, { replaceSchema: v[1] })); toast('นำเข้า ' + r.stations + ' สถานี ' + r.equipment + ' อุปกรณ์แล้ว'); }
  else {
    if (v[1] && b.schema) await store.saveSchema(b.schema);
    for (const st of b.stations) await store.saveStation(st);
    for (const e of b.equipment) { const { stationId, ...rest } = e; await store.saveEquipment(stationId, rest); }
    log('นำเข้าไฟล์สำรอง', b.stations.length + ' สถานี ' + b.equipment.length + ' อุปกรณ์'); toast('นำเข้าแล้ว');
  }
  schema = await store.getSchema(); indexSchema(); await loadStations(); cur.station = null; cur.view = 'station'; render();
}
async function changePassword() {
  if (!SERVER) { toast('บัญชีนี้ใช้รหัสผ่านของ Google'); return; }
  const v = await ask('เปลี่ยนรหัสผ่าน', [{ label: 'รหัสผ่านเดิม', type: 'password', required: true }, { label: 'รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)', type: 'password', required: true }, { label: 'ยืนยันรหัสผ่านใหม่', type: 'password', required: true }]);
  if (!v) return;
  if (v[1] !== v[2]) { toast('รหัสผ่านใหม่ไม่ตรงกัน'); return; }
  try { await store.call('POST', 'password', { old: v[0], new: v[1] }); toast('เปลี่ยนรหัสผ่านแล้ว'); } catch (e) { toast(e.message); }
}

  $('whoami').textContent = (me.name || me.email) + ' · ' + (ROLE_TH[me.role] || me.role);
  $('navSchema').hidden = !can.admin(); $('navUsers').hidden = !can.admin(); $('addStationBtn').hidden = !can.edit();

    if (!can.admin()) { $('main').innerHTML = '<div class="empty">ระบบยังไม่ได้ตั้งค่าโครงสร้างข้อมูล ติดต่อผู้ดูแล</div>'; return; }
    schema = await (await fetch('schema-seed.json')).json();
    schema.createdAt = new Date().toISOString(); schema.createdBy = me.email;
    await store.saveSchema(schema); log('ตั้งค่าโครงสร้างเริ่มต้น', 'มาตรฐานข้อมูลทรัพย์สินสถานีไฟฟ้า'); toast('ตั้งค่าโครงสร้างข้อมูลมาตรฐานแล้ว');
  }
  indexSchema(); await loadStations(); render();
}

  }

  $('logoutBtn').onclick = () => A.signOut(auth).then(() => location.reload());

    me = { email, name: (rec && rec.name) || u.displayName || '', role };
    startApp().catch(e => { $('main').innerHTML = '<div class="empty">โหลดข้อมูลไม่ได้: ' + esc(e.message) + '</div>'; });
